<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UBaOS MAX</title>
<style>
/* ===== Base y tema ===== */
:root{--a:#5ef4ff;--tx:#e8f0ff;--g:rgba(18,24,48,.55);--g2:rgba(255,255,255,.09);--bd:rgba(255,255,255,.15);--is:72px}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#0a0e1a;color:var(--tx);user-select:none}
body.light{--tx:#14203a;--g2:rgba(0,0,0,.07);--bd:rgba(0,0,0,.14)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--g2);border:1px solid var(--bd);border-radius:10px;padding:6px 11px;cursor:pointer;transition:.15s}
button:hover,.on{background:var(--a)!important;color:#001018!important}
input,select,textarea{background:var(--g2);border:1px solid var(--bd);border-radius:10px;padding:6px 10px;outline:0;user-select:text}
input:focus,textarea:focus{border-color:var(--a)}select option{color:#000}
.gl{background:var(--g);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--bd);box-shadow:0 12px 40px #0007}
/* ===== Arranque ===== */
#boot{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 40%,#1b2a5a,#0a0e1a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;transition:opacity .6s}
.logo{font-size:clamp(34px,8vw,64px);font-weight:800;letter-spacing:.15em}.logo b{color:var(--a);text-shadow:0 0 30px var(--a)}
#bar{width:min(320px,70vw);height:6px;border-radius:9px;background:#fff2;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ef4ff,#b985ff);transition:width 2.4s ease}
/* ===== Escritorio, ventanas, barra ===== */
#desk{position:fixed;inset:0;background-size:cover}#icons{position:absolute;inset:0 0 56px 0}
.ic{position:absolute;width:calc(var(--is) + 24px);text-align:center;padding:6px;border-radius:12px;font-size:12px;text-shadow:0 1px 4px #000;color:#fff;cursor:pointer;touch-action:none}
.ic:hover,.ic.sel{background:#fff2}.ic em{display:block;font-style:normal;font-size:calc(var(--is)*.6);line-height:1.1}
.win{position:absolute;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;animation:op .2s;outline:0;min-width:260px;min-height:180px}
.win.min{display:none}.win.mx{left:0!important;top:0!important;right:0;bottom:56px;width:auto!important;height:auto!important;border-radius:0}.win.cl{animation:cl .18s forwards}
.win.act{box-shadow:0 18px 60px #000a,0 0 0 1px var(--a)}
@keyframes op{from{opacity:0;transform:scale(.92)}}@keyframes cl{to{opacity:0;transform:scale(.92)}}
.tt{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;cursor:move;font-weight:600;background:var(--g2);touch-action:none;flex:none}
.wb button{padding:2px 9px;margin-left:4px;border-radius:7px}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.rz{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none}
#tb{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:9000;border-width:1px 0 0}
#tb.f{left:10%;right:10%;bottom:8px;border-radius:20px;border-width:1px}
#run{flex:1;display:flex;gap:6px;overflow:hidden}#tb.c #run{justify-content:center}
#run button.mn{opacity:.5}#run button.ac{border-bottom:2px solid var(--a)}
#clk{text-align:center;cursor:pointer;line-height:1.1;padding:2px 8px;border-radius:8px;font-size:14px}
sup{color:var(--a);font-weight:700}
#sm{position:absolute;left:10px;bottom:62px;width:min(440px,94vw);border-radius:18px;padding:14px;z-index:9500;display:none}#sm.o{display:block;animation:op .15s}

#nc{position:absolute;right:10px;bottom:62px;top:10px;width:min(340px,94vw);border-radius:18px;padding:14px;z-index:9500;transform:translateX(120%);transition:transform .3s;display:flex;flex-direction:column;gap:10px}#nc.o{transform:none}
.qs{display:flex;gap:6px;flex-wrap:wrap}#nl{flex:1;overflow:auto}
#toasts{position:fixed;right:14px;top:14px;z-index:99998;display:flex;flex-direction:column;gap:8px}.toast{padding:10px 14px;border-radius:12px;animation:op .2s;max-width:300px;font-size:13px}.toast.err{border-color:#ff5e7a}.toast.ok{border-color:#7dffb0}
#cm{position:fixed;display:none;z-index:99997;padding:6px;border-radius:12px;min-width:180px}#cm div{padding:7px 12px;border-radius:8px;cursor:pointer}#cm div:hover{background:var(--a);color:#001018}
.ov{position:fixed;inset:0;z-index:99990;background:#0006;display:flex;align-items:center;justify-content:center}.bx{padding:20px;border-radius:16px;display:flex;flex-direction:column;gap:12px;min-width:260px}
/* ===== Apps ===== */
.tl{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center;flex:none}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row.c{justify-content:center}
.rw{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--bd)}.rw span{flex:1}
.emp{margin:auto;text-align:center;opacity:.6;padding:30px;grid-column:1/-1}.emp em{font-size:56px;display:block;font-style:normal}

.fl{flex:1;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;align-content:start}.fl.l{display:block}
.it{padding:8px;border-radius:10px;text-align:center;font-size:12px;cursor:pointer;word-break:break-word}.it:hover{background:var(--g2)}.it em{display:block;font-style:normal;font-size:34px}
.l .it{display:flex;gap:10px;text-align:left;align-items:center}.l .it em{font-size:20px;display:inline}
.sp{flex:1;display:flex;min-height:0}.sl{width:210px;display:flex;flex-direction:column;border-right:1px solid var(--bd)}.sl>input{margin:0 8px 8px}.ls{overflow:auto;flex:1}.ls div{padding:8px 12px;cursor:pointer;border-radius:8px;margin:2px 6px}.ls div:hover{background:var(--g2)}
.ed{flex:1;display:flex;flex-direction:column;min-width:0}textarea{flex:1;margin:0 8px 8px;resize:none}
.cc{display:flex;gap:10px;padding:10px;flex:1;min-height:0}.cm1{flex:1;display:flex;flex-direction:column;gap:8px}.dp{text-align:right;padding:10px;background:var(--g2);border-radius:12px}.dp small{display:block;min-height:16px;opacity:.6}.dp div{font-size:34px;overflow:hidden}
.kg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kg button{font-size:18px}.hs{width:150px;overflow:auto;font-size:12px}.hs p{padding:4px 0;border-bottom:1px solid var(--bd)}
.cv{flex:1;overflow:auto;background:#555}.cv canvas{display:block;background:#fff;touch-action:none;cursor:crosshair}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 10px}.cg div{text-align:center;padding:8px 0;border-radius:8px;cursor:pointer;position:relative}.cg .h{opacity:.6;cursor:default;font-size:12px}.cg .td{border:1px solid var(--a)}
.cg .ev::after{content:'';position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--a)}.cg .on::after{background:#001018}.ce{flex:1;overflow:auto}
.mu{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;text-align:center}.big{font-size:56px}.pl div{padding:6px 10px;border-radius:8px;cursor:pointer;text-align:left}.pl div:hover{background:var(--g2)}
.tm{flex:1;overflow:auto;padding:10px;background:#050810cc;color:#7dffb0;user-select:text}.tm,.tm *{font-family:Consolas,monospace}.tm input{background:none;border:0;color:inherit;flex:1;padding:0}.ln{display:flex}
.nb{padding:4px 10px;font-size:12px;opacity:.7;flex:none}.vw{flex:1;background:#0e1426;display:flex;overflow:auto}body.light .vw{background:#eef2fb}.vw iframe{border:0;flex:1;background:#fff}
.hp{flex:1;padding:30px;text-align:center}.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}.tile{padding:12px 18px;border-radius:12px;background:var(--g2);cursor:pointer}
.st{padding:12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px}.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{width:56px;height:38px;border-radius:9px;cursor:pointer;background-size:cover}.sw i.s{outline:3px solid var(--a)}
@media(max-width:700px){.sl{width:120px}.hs{display:none}#run button span,#st span{display:none}}
</style></head><body>
<div id="boot"><div class="logo">UBa<b>OS</b> MAX</div><div id="bar"><i></i></div><p id="tx1">Iniciando…</p><button id="go" hidden>Entrar al escritorio ➜</button></div>
<div id="desk"><div id="icons"></div><div id="wins"></div>
<div id="sm" class="gl"><input id="ss" placeholder="🔍 Buscar aplicaciones…" style="width:100%"><div id="sg" class="ag"></div><div class="row"><small>UBaOS MAX v1.0</small><button id="rb">⏻ Reiniciar</button></div></div>

<div id="cm" class="gl"></div><div id="toasts"></div>
<script>
/* ===== Utilidades y estado (LocalStorage) ===== */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];

const D={theme:'dark',acc:'#5ef4ff',bg:0,img:null,op:.55,is:72,tb:'c',fs:[],notes:[],ev:{},mk:[['Wikipedia','https://es.wikipedia.org'],['OpenStreetMap','https://www.openstreetmap.org']],bin:[],nt:[],pos:{},vol:.7,wifi:1,bt:0};
let S;try{S={...JSON.parse(JSON.stringify(D)),...JSON.parse(localStorage.getItem('ubaos')||'{}')}}catch(e){S=JSON.parse(JSON.stringify(D))}
if(!S.fs.length)S.fs=[{id:'d',name:'Documentos',t:'d',p:'r'},{id:'i',name:'Imágenes',t:'d',p:'r'},{id:'m',name:'Música',t:'d',p:'r'},{id:'b',name:'Bienvenida.txt',t:'f',p:'d',c:'¡Bienvenido a UBaOS MAX!',m:'text/plain'}];
let _t;const save=()=>{try{localStorage.setItem('ubaos',JSON.stringify(S))}catch(e){toast('Error','No hay espacio para guardar (archivo demasiado grande).','err')}},sv=()=>{clearTimeout(_t);_t=setTimeout(save,250)};
addEventListener('beforeunload',save);
const dl=(n,bl)=>{const a=h('a');a.href=URL.createObjectURL(bl);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
const BG=['linear-gradient(135deg,#0a0e1a,#1b2a5a,#4a1d7a)','linear-gradient(160deg,#021b2b,#0b6e7f,#5ef4ff)','linear-gradient(135deg,#2b0a3d,#b985ff,#ff7ab8)','linear-gradient(150deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#1a1a1a,#434343)','linear-gradient(160deg,#42275a,#734b6d)','linear-gradient(135deg,#ff9966,#ff5e62)','radial-gradient(circle at 30% 20%,#5ef4ff55,transparent 40%),radial-gradient(circle at 80% 70%,#b985ff66,transparent 45%),#0a0e1a'];
function apply(){const r=document.documentElement.style,l=S.theme=='light';document.body.classList.toggle('light',l);r.setProperty('--a',S.acc);r.setProperty('--g',l?`rgba(255,255,255,${S.op})`:`rgba(18,24,48,${S.op})`);r.setProperty('--is',S.is+'px');$('#desk').style.background=S.img?`center/cover url("${S.img}")`:BG[S.bg];$('#tb').className='gl '+S.tb;sv()}
/* ===== Notificaciones, menú contextual, diálogo ===== */
function toast(t,x,k){const e=h('div','toast gl '+(k||''),`<b>${t}</b><br>${x}`);$('#toasts').append(e);setTimeout(()=>e.remove(),3200)}
function notify(t,x,k){S.nt.unshift({t,x,d:new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})});S.nt=S.nt.slice(0,30);sv();toast(t,x,k);rnc()}
function rnc(){const l=$('#nl');l.innerHTML=S.nt.length?'':'<div class="emp"><em>🔕</em>Sin notificaciones</div>';S.nt.forEach(n=>l.append(h('div','rw',`<span><b>${n.t}</b><br><small>${n.x} · ${n.d}</small></span>`)));$('#nbc').textContent=S.nt.length||''}
function ctx(e,it){e.preventDefault();e.stopPropagation();const m=$('#cm');m.innerHTML='';it.forEach(([l,f])=>{const d=h('div','',l);d.onclick=()=>{m.style.display='none';f()};m.append(d)});m.style.display='block';m.style.left=Math.min(e.clientX,innerWidth-190)+'px';m.style.top=Math.min(e.clientY,innerHeight-it.length*36-10)+'px'}
function ask(m,d,f){const o=h('div','ov',`<div class="gl bx"><p>${m}</p><input value="${esc(d)}"><div class="row c"><button class="ok">Aceptar</button><button class="no">Cancelar</button></div></div>`),i=$('input',o),x=()=>o.remove(),ok=()=>{const v=i.value.trim();if(v){x();f(v)}};document.body.append(o);i.focus();i.select();$('.ok',o).onclick=ok;$('.no',o).onclick=x;i.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')ok();if(e.key=='Escape')x()}}
/* ===== Sistema de ventanas ===== */
let z=10,W={},act=null,ready=0;
function launch(id,arg){let w=W[id];if(w){foc(id);if(arg&&w.arg)w.arg(arg);return}
 const a=A[id],el=h('div','win gl'),n=Object.keys(W).length,vw=innerWidth,vh=innerHeight-56,wd=Math.min(a.w,vw-10),ht=Math.min(a.h,vh-10);
 el.style.cssText=`width:${wd}px;height:${ht}px;left:${Math.min(Math.max(5,(vw-wd)/2+n*26-50),vw-wd-5)}px;top:${Math.min(Math.max(5,(vh-ht)/2+n*26-50),vh-ht-5)}px`;
 el.tabIndex=-1;el.innerHTML=`<div class="tt"><span>${a.i} ${a.n}</span><span class="wb"><button title="Minimizar">—</button><button title="Maximizar">▢</button><button title="Cerrar">✕</button></span></div><div class="bd"></div><i class="rz"></i>`;
 w=W[id]={el,id};$('#wins').append(el);
 const [bm,bx,bc]=$$('.wb button',el),tt=$('.tt',el),rz=$('.rz',el);
 bm.onclick=()=>{el.classList.add('min');if(act==id)act=null;tbr()};bx.onclick=()=>el.classList.toggle('mx');bc.onclick=()=>clo(id);
 tt.ondblclick=e=>{if(!e.target.closest('button'))bx.onclick()};el.onpointerdown=()=>foc(id);
 tt.onpointerdown=e=>{if(e.target.closest('button')||el.classList.contains('mx'))return;const dx=e.clientX-el.offsetLeft,dy=e.clientY-el.offsetTop;tt.setPointerCapture(e.pointerId);
  tt.onpointermove=m=>{el.style.left=Math.min(Math.max(80-el.offsetWidth,m.clientX-dx),innerWidth-80)+'px';el.style.top=Math.min(Math.max(0,m.clientY-dy),innerHeight-90)+'px'};tt.onpointerup=()=>tt.onpointermove=null};
 rz.onpointerdown=e=>{e.stopPropagation();foc(id);const x=e.clientX,y=e.clientY,w0=el.offsetWidth,h0=el.offsetHeight;rz.setPointerCapture(e.pointerId);
  rz.onpointermove=m=>{el.style.width=Math.max(260,w0+m.clientX-x)+'px';el.style.height=Math.max(180,h0+m.clientY-y)+'px'};rz.onpointerup=()=>rz.onpointermove=null};
 a.f($('.bd',el),w);foc(id);el.focus({preventScroll:true});if(arg&&w.arg)w.arg(arg)}
function foc(id){const w=W[id];if(!w)return;w.el.classList.remove('min');act=id;w.el.style.zIndex=++z;$$('.win').forEach(e=>e.classList.toggle('act',e==w.el));tbr()}
function clo(id){const w=W[id];if(!w)return;w.el.classList.add('cl');delete W[id];if(act==id)act=null;tbr();setTimeout(()=>w.el.remove(),180)}
function tbr(){const r=$('#run');r.innerHTML='';for(const id in W){const e=W[id].el,mn=e.classList.contains('min'),b=h('button',mn?'mn':act==id?'ac':'',`${A[id].i}<span> ${A[id].n.replace('UBa ','')}</span>`);b.onclick=()=>{if(mn||act!=id)foc(id);else{e.classList.add('min');act=null;tbr()}};r.append(b)}}
/* ===== UBa Explorer ===== */
function explorer(b){let p='r',v='g',q='';
 b.innerHTML='<div class="tl"><button class="up">⬆ Subir</button><button class="nf">📁 Carpeta</button><button class="nt">📄 Archivo</button><button class="im">⬇ Importar</button><button class="vw2">☰ / ▦</button><input class="sq" placeholder="🔍 Buscar…"></div><div class="pth"></div><div class="fl"></div><input type="file" multiple hidden>';
 const L=$('.fl',b),P=$('.pth',b),FI=$('input[type=file]',b);
 const kid=f=>f.t=='d'?'📁':f.m?.startsWith('image')?'🖼️':f.m?.startsWith('audio')?'🎵':'📄';
 const anc=(id,t)=>{while(id&&id!='r'){if(id==t)return true;id=S.fs.find(f=>f.id==id)?.p}return false};
 const mv=(id,to)=>{const f=S.fs.find(x=>x.id==id);if(!f||f.p==to)return;if(anc(to,id))return notify('No permitido','No puedes mover una carpeta dentro de sí misma','err');f.p=to;sv();R();notify('Movido',esc(f.name),'ok')};
 const drop=(e,id)=>{e.ondragover=ev=>ev.preventDefault();e.ondrop=ev=>{ev.preventDefault();mv(ev.dataTransfer.getData('text'),id)}};
 const del=f=>{const ids=[f.id];if(f.t=='d'){let ch=[f.id];while(ch.length){const k=S.fs.filter(x=>ch.includes(x.p)).map(x=>x.id);ids.push(...k);ch=k}}
  const o=S.fs.filter(x=>ids.includes(x.id));S.fs=S.fs.filter(x=>!ids.includes(x.id));S.bin.push({id:uid(),n:f.name,r:f.id,o,from:f.p});sv();R();notify('Papelera','Movido: '+esc(f.name))};

  if(f.m?.startsWith('image'))launch('vi',f.id);

  P.innerHTML='';const hm=h('span','','🏠 Inicio');hm.onclick=()=>{p='r';q='';R()};drop(hm,'r');P.append(hm);

  const it=S.fs.filter(f=>q?f.name.toLowerCase().includes(q):f.p==p).sort((a,b)=>a.t.localeCompare(b.t)||a.name.localeCompare(b.name));
  L.className='fl'+(v=='l'?' l':'');L.innerHTML=it.length?'':`<div class="emp"><em>📂</em>${q?'Sin resultados':'Esta carpeta está vacía'}<br><small>Crea o importa archivos</small></div>`;
  it.forEach(f=>{const e=h('div','it',`<em>${kid(f)}</em>${esc(f.name)}`);e.draggable=true;e.ondragstart=ev=>ev.dataTransfer.setData('text',f.id);if(f.t=='d')drop(e,f.id);e.ondblclick=()=>opn(f);
   e.oncontextmenu=ev=>ctx(ev,[['📂 Abrir',()=>opn(f)],['✏️ Renombrar',()=>ask('Nuevo nombre',f.name,n=>{f.name=n;sv();R()})],['🗑️ Eliminar',()=>del(f)]]);L.append(e)})};
 $('.up',b).onclick=()=>{const f=S.fs.find(f=>f.id==p);if(f){p=f.p;R()}};
